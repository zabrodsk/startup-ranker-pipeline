name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, testing]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The suite is hermetic: no secrets, no network. Tests that need
      # provider keys or Supabase config set their own fakes.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff (correctness rules)
        # Full strict config (D/I/T201/UP) has a known backlog; CI gates only
        # on real errors. F841 backlog is tracked for later sprints.
        run: uv run ruff check --select F,E9 --ignore F841 .

      - name: Byte-compile web entrypoints
        run: uv run python -m py_compile web/app.py web/db.py

      - name: Pytest
        run: uv run python -m pytest tests -q

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Static UI contract
        run: uv run python -m pytest tests/test_web_static_ui_contract.py -q

      - name: Browser, visual, responsive, and accessibility suite
        run: npm run test:ui

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
